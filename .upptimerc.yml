owner: Chili36
repo: upptime

sites:
  - name: EU Pesticides API - residue definitions
    url: "https://api.datalake.sante.service.ec.europa.eu/sante/pesticides/pesticide-residues?format=json&pesticide_residue_lg=EN&api-version=v3.0"
    maxResponseTime: 30000
    __dangerous__body_down_if_text_missing: "pesticide_residue_id"
  - name: EU Pesticides API - active substances
    url: "https://api.datalake.sante.service.ec.europa.eu/sante/pesticides/active-substances?format=json&api-version=v3.0"
    maxResponseTime: 30000
    __dangerous__body_down_if_text_missing: "substance_id"

status-website:
  baseUrl: /upptime
  name: EU API status
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
